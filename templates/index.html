<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CAPE-Sight | Malware Analysis</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2b4976; color: #ffffff; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }

        .panel { background-color: #3b5c8d; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }

        .header-panel { text-align: center; padding: 30px 20px; }
        .header-panel h1 { margin: 0 0 10px 0; font-size: 2.2em; }
        .header-panel p { margin: 0; color: #b8cde6; font-size: 1.1em; }

        .stats-container { display: flex; gap: 15px; justify-content: space-between; margin-bottom: 20px; }
        .stat-box { background-color: #426496; flex: 1; text-align: center; padding: 20px 10px; border-radius: 10px; }
        .stat-value { font-size: 1.8em; font-weight: bold; display: block; margin-bottom: 5px; }
        .stat-label { font-size: 0.9em; color: #d0dbe8; font-weight: 500; }

        .btn { border-radius: 25px; padding: 12px 30px; border: none; cursor: pointer; font-size: 1em; font-weight: bold; transition: background 0.3s; color: white; display: inline-block; text-decoration: none; }
        .btn-primary { background-color: #ff6b6b; }
        .btn-primary:hover { background-color: #ff5252; }
        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover { background-color: #5a6268; }

        .form-content { text-align: left; }
        .file-wrapper { background-color: rgba(0,0,0,0.15); padding: 20px; border-radius: 8px; border: 1px dashed rgba(255,255,255,0.3); margin-bottom: 20px; }
        input[type="file"] { color: white; font-size: 1em; }
        input[type="file"]::file-selector-button { background-color: #426496; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-right: 15px; }

        .rule-list { background-color: rgba(0,0,0,0.15); border-radius: 8px; padding: 15px; max-height: 150px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .rule-item { display: block; margin-bottom: 10px; cursor: pointer; color: #e2e8f0; }

        /* 진행률 바 */
        .progress-panel { display: none; text-align: center; padding: 40px 20px; }
        .progress-track { background-color: #2b4976; border-radius: 15px; height: 25px; overflow: hidden; margin: 20px auto; max-width: 800px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        .progress-fill { background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%); width: 0%; height: 100%; transition: width 0.5s ease-in-out; }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel header-panel">
            <h1>🎯 CAPE-Sight</h1>
            <p>악성코드 동적 분석- IOC 추출 및 YARA 위협 탐지 시스템</p>
        </div>

        <div class="stats-container">
            <div class="stat-box">
                <span class="stat-value" id="statFiles">1</span>
                <span class="stat-label">대상 파일 수</span>
            </div>
            <div class="stat-box">
                <span class="stat-value" id="statStatus">-</span>
                <span class="stat-label">스캔 상태</span>
            </div>
            <div class="stat-box">
                <span class="stat-value">-</span>
                <span class="stat-label">위협 탐지</span>
            </div>
            <div class="stat-box">
                <span class="stat-value">{{ yara_rules|length }}</span>
                <span class="stat-label">활성 룰</span>
            </div>
        </div>

        <div class="panel" id="mainPanel">
            <form id="uploadForm">
                <div style="margin-bottom: 20px;">
                    <button type="submit" class="btn btn-primary" id="startBtn">🚀 스캔 시작</button>
                </div>

                <div class="form-content">
                    <div class="file-wrapper">
                        <input type="file" name="file" required>
                    </div>
                    
                    <h3 style="margin-top: 0; font-size: 1.1em; color: #d0dbe8;">적용할 YARA 룰 선택</h3>
                    <div class="rule-list">
                        {% for rule in yara_rules %}
                            <label class="rule-item">
                                <input type="checkbox" name="yara_rules" value="{{ rule }}" checked> {{ rule }}
                            </label>
                        {% endfor %}
                        {% if not yara_rules %}
                            <span style="color: #999;">적용 가능한 YARA 룰이 없습니다.</span>
                        {% endif %}
                    </div>
                </div>
            </form>
        </div>

        <div class="panel progress-panel" id="progressPanel">
            <h2 id="statusText" style="margin-top: 0; color: #ffffff; font-size: 1.8em;">샌드박스 환경 준비 중...</h2>
            
            <div class="progress-track">
                <div class="progress-fill" id="pBar"></div>
            </div>
            
            <p style="color: #b8cde6; font-size: 1em; margin-bottom: 30px;">안전한 환경에서 파일을 실행하고 분석 중입니다.</p>
            
            <div>
                <a href="/" class="btn btn-secondary">🏠 스캔 취소 및 메인으로</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            document.getElementById('mainPanel').style.display = 'none';
            document.getElementById('progressPanel').style.display = 'block';
            document.getElementById('statStatus').innerText = "업로드 중";

            // 파일 전송
            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();
            
            if(data.task_id) {
                checkStatus(data.task_id);
            } else {
                document.getElementById('statusText').innerText = "업로드 실패";
                document.getElementById('statusText').style.color = "#ff6b6b";
                document.getElementById('pBar').style.background = "#ff6b6b";
            }
        };

        async function checkStatus(taskId) {
            const bar = document.getElementById('pBar');
            const txt = document.getElementById('statusText');
            const statStatus = document.getElementById('statStatus');

            const interval = setInterval(async () => {
                const res = await fetch(`/status/${taskId}`);
                const data = await res.json();

                if (data.status === 'pending') {
                    txt.innerText = "분석 대기 중 (Pending)";
                    statStatus.innerText = "대기중";
                    bar.style.width = '20%';
                } else if (data.status === 'running') {
                    txt.innerText = "동적 분석 진행 중 (Running)";
                    statStatus.innerText = "분석중";
                    bar.style.width = '60%';
                } else if (data.status === 'completed' || data.status === 'reported') {
                    bar.style.width = '100%';
                    statStatus.innerText = "완료됨";
                    clearInterval(interval);
                    txt.innerText = "리포트 생성 완료! 결과를 불러옵니다...";
                    
                    setTimeout(() => {
                        location.href = `/result_page/${taskId}`;
                    }, 1500);
                } else if (data.status === 'failed' || data.status === 'error') {
                    clearInterval(interval);
                    txt.innerText = "분석 실패 (에러 발생)";
                    statStatus.innerText = "실패";
                    txt.style.color = "#ff6b6b";
                    bar.style.background = "#ff6b6b";
                }
            }, 10000);
        }
    </script>
</body>
</html>
